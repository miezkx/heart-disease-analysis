<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Akademicka aplikacja do analizy danych HeartDisease">
    <title>{% block title %}Analiza chorób serca{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg app-navbar" aria-label="Główna nawigacja">
      <div class="container-fluid app-container">
        <button
          class="navbar-toggler ms-auto"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNavigation"
          aria-controls="mainNavigation"
          aria-expanded="false"
          aria-label="Pokaż nawigację"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNavigation">
          <ul class="navbar-nav ms-auto gap-lg-1">
            <li class="nav-item">
              <a
                class="nav-link {{ 'active' if active_page == 'dashboard' else '' }}"
                {% if active_page == 'dashboard' %}aria-current="page"{% endif %}
                href="{{ url_for('dashboard.index') }}"
              >
                Dashboard
              </a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {{ 'active' if active_page == 'analysis' else '' }}"
                {% if active_page == 'analysis' %}aria-current="page"{% endif %}
                href="{{ url_for('analysis.index') }}"
              >Analiza</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {{ 'active' if active_page == 'models' else '' }}"
                {% if active_page == 'models' %}aria-current="page"{% endif %}
                href="{{ url_for('models_view.index') }}"
              >Modele</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {{ 'active' if active_page == 'prediction' else '' }}"
                {% if active_page == 'prediction' %}aria-current="page"{% endif %}
                href="{{ url_for('prediction.index') }}"
              >Predykcja</a>
            </li>
            <li class="nav-item">
              <a
                class="nav-link {{ 'active' if active_page == 'history' else '' }}"
                {% if active_page == 'history' %}aria-current="page"{% endif %}
                href="{{ url_for('history.index') }}"
              >Historia</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="app-container py-4 py-lg-5">
      {% block content %}{% endblock %}
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
